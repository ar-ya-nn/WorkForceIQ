<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="WorkForceIQ">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a78c0"/>
      <stop offset="1" stop-color="#1c2f57"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect width="64" height="64" rx="15" fill="url(#shine)"/>
  <!-- three rising bars: people + growth -->
  <rect x="15" y="34" width="8" height="15" rx="3" fill="#ffffff" fill-opacity="0.7"/>
  <rect x="28" y="26" width="8" height="23" rx="3" fill="#ffffff" fill-opacity="0.85"/>
  <rect x="41" y="18" width="8" height="31" rx="3" fill="#ffffff"/>
  <circle cx="45" cy="11.5" r="3.5" fill="#ffffff"/>
</svg>
